name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev/viz/pandas extras
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check src tests

      - name: Type check (mypy)
        run: |
          python -m pip install mypy
          mypy src/mrsvalidate || true  # advisory until the codebase is fully annotated-clean

      - name: Unit + property tests
        run: pytest tests/unit tests/property -q

      - name: Reference tests (SciPy/Statsmodels equivalence)
        run: pytest tests/reference -q

      - name: Adversarial fixture suite
        run: pytest tests/adversarial -q

      - name: Integration tests
        run: pytest tests/integration -q

      - name: Plot boundary tests
        run: pytest tests/plots -q

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel into a clean environment and smoke-test
        run: |
          python -m venv /tmp/clean-env
          . /tmp/clean-env/bin/activate || /tmp/clean-env/Scripts/activate
          pip install dist/*.whl
          python -c "import mrsvalidate; print(mrsvalidate.__version__)"
        shell: bash

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  # Publication is intentionally left unconfigured: it requires a registered
  # PyPI project and an OIDC Trusted Publisher relationship set up by the
  # repository administrator (see LIBRARY_IMPLEMENTATION_SPEC.md, "Release
  # process"). This job is a template for that future step, not a live
  # publication path — it has no trigger and no `id-token: write` permission
  # granted anywhere else in this workflow.
  publish:
    name: Publish to PyPI (not yet configured)
    if: false
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-ubuntu-latest-3.11
          path: dist
          merge-multiple: true
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
